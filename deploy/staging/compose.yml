services:
  api:
    image: ${COMMERCE_IMAGE:?Set COMMERCE_IMAGE to an approved, immutable image reference.}
    env_file: .env
    ports:
      - "127.0.0.1:${STAGING_API_PORT:-3000}:3000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
