name: Commerce API checks

on:
  pull_request:
  push:
    branches: [main, feature/milestone-1-foundation, feature/commerce-backend-end-to-end]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: commerce
          POSTGRES_DB: commerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://commerce:commerce@127.0.0.1:5432/commerce_test?schema=public
      DATA_DRIVER: memory
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate schema and generate client
        run: |
          pnpm db:validate
          pnpm db:generate
          test -f apps/api/src/generated/prisma/client.ts
      - name: Deploy migrations and verify repeatability
        run: |
          pnpm db:deploy
          pnpm db:deploy
          pnpm db:status
          pnpm db:drift
      - name: Populated commerce and identity migration preservation
        run: pnpm test:migrations
      - name: Domain, memory and configuration unit tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Production build
        run: pnpm build
      - name: Merchant admin TypeScript checks
        run: pnpm typecheck:admin
      - name: Merchant admin contract and utility tests
        run: pnpm test:admin
      - name: Merchant admin production build
        run: pnpm build:admin
      - name: Customer storefront TypeScript checks
        run: pnpm typecheck:storefront
      - name: Customer storefront contract and utility tests
        run: pnpm test:storefront
      - name: Customer storefront production build
        run: pnpm build:storefront
      - name: Memory API integration tests
        run: pnpm test:integration
      - name: PostgreSQL API, repository and schema integration tests
        run: pnpm test:postgres
      - name: Complete disposable backend demonstration
        run: pnpm demo:backend --verify-and-exit
